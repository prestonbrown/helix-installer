name: CI

on:
  # Branches only: a release tag is built by release.yml, not re-checked here.
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # busybox: the version probe tests run BusyBox grep and tr, as the printers do.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf busybox
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Build UI
        working-directory: ui
        run: npm run build
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check UI
        working-directory: ui
        run: npm run check
      - name: Test UI
        working-directory: ui
        run: npm test
      - name: Test the updater manifest script
        if: runner.os == 'Linux'
        run: python3 scripts/test_updater_manifest.py
      - name: Test the published manifest builder
        if: runner.os == 'Linux'
        run: python3 scripts/test_publish_manifest.py
      - name: Check help links against the site's address scheme
        if: runner.os == 'Linux'
        run: |
          python3 scripts/test_check_help_links.py
          python3 scripts/check_help_links.py --scheme
