name: Release

# A v* tag, or a manual run, builds every installer and leaves a DRAFT release for a person to
# publish. Nothing here needs a secret: with none set, everything builds unsigned and the
# "Signing" summary of each job says so. Setup steps for each secret: docs/SIGNING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      updater: ${{ steps.flags.outputs.updater }}
    steps:
      - id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dispatch-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi
      - id: flags
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi

  # Every help page the app links must be live before a release is built, so a release never
  # ships a dead link. No pending list is passed here.
  help-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/check_help_links.py

  build:
    needs: [plan, help-links]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            args: ""
          - os: macos-latest
            label: macos
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            label: linux
            args: ""
    runs-on: ${{ matrix.os }}
    # The draft release and its assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Each signing step is switched on by its secrets and only by them: a secret that is not set
      # leaves that artifact unsigned, never a failed build. Only the switches go to GITHUB_ENV.
      # The credentials themselves reach no step but this check and the Tauri build below, so no
      # dependency install or third-party action ever has them in its environment.
      - name: Decide what gets signed
        shell: bash
        env:
          IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IN_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          IN_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          IN_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          IN_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          sign_apple=false; notarize=false; sign_azure=false; sign_updater=false
          if [ "$RUNNER_OS" = macOS ]; then
            [ -n "$IN_APPLE_CERTIFICATE" ] && [ -n "$IN_APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$IN_APPLE_SIGNING_IDENTITY" ] && sign_apple=true
            [ "$sign_apple" = true ] && [ -n "$IN_APPLE_ID" ] && [ -n "$IN_APPLE_PASSWORD" ] && [ -n "$IN_APPLE_TEAM_ID" ] && notarize=true
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            [ -n "$IN_AZURE_TENANT_ID" ] && [ -n "$IN_AZURE_CLIENT_ID" ] && [ -n "$IN_AZURE_CLIENT_SECRET" ] \
              && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ] && [ -n "$AZURE_SIGNING_PROFILE" ] && sign_azure=true
          fi
          [ -n "$IN_TAURI_SIGNING_PRIVATE_KEY" ] && sign_updater=true
          {
            echo "SIGN_APPLE=$sign_apple"
            echo "NOTARIZE_APPLE=$notarize"
            echo "SIGN_AZURE=$sign_azure"
            echo "SIGN_UPDATER=$sign_updater"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.label == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Install the Azure Artifact (Trusted) Signing client
        if: env.SIGN_AZURE == 'true'
        run: cargo install artifact-signing-cli --locked --version 0.12.0

      # Per-run overrides for tauri.conf.json, so the checked-in config builds unsigned anywhere. The
      # UI is built above, so the bundler's own pre-build command is switched off.
      - name: Write the build configuration
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          node -e '
            const bundle = {};
            const build = { beforeBuildCommand: "" };
            if (process.env.SIGN_UPDATER === "true") bundle.createUpdaterArtifacts = true;
            if (process.env.SIGN_AZURE === "true") {
              bundle.windows = { signCommand: [
                "artifact-signing-cli", "-e", process.env.AZURE_SIGNING_ENDPOINT,
                "-a", process.env.AZURE_SIGNING_ACCOUNT, "-c", process.env.AZURE_SIGNING_PROFILE,
                "-d", "HelixScreen Installer", "%1"
              ].join(" ") };
            }
            require("fs").writeFileSync("crates/app/ci-config.json", JSON.stringify({ build, bundle }));
          '

      # scripts/tauri-signed.cjs passes on only the credentials the switches above turned on.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IN_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          IN_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          IN_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          IN_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/app
          tauriScript: node ../../scripts/tauri-signed.cjs
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: HelixScreen Installer ${{ needs.plan.outputs.tag }}
          releaseBody: Unsigned builds are listed in each build job's Signing summary. Review, then publish.
          releaseDraft: true
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          args: --config ci-config.json ${{ matrix.args }}

      - name: Signing
        if: always()
        shell: bash
        run: |
          {
            echo "### Signing: ${{ matrix.label }}"
            case "$RUNNER_OS" in
              macOS)
                if [ "$SIGN_APPLE" = true ]; then echo "- .dmg: Developer ID signed"; else echo "- .dmg: UNSIGNED (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY not all set); Gatekeeper will block it"; fi
                if [ "$NOTARIZE_APPLE" = true ]; then echo "- .dmg: notarized"; else echo "- .dmg: NOT notarized (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID not all set, or no signing certificate)"; fi ;;
              Windows)
                if [ "$SIGN_AZURE" = true ]; then echo "- .msi and .exe: signed with Azure Trusted Signing"; else echo "- .msi and .exe: UNSIGNED (Azure Trusted Signing secrets not all set); SmartScreen will warn"; fi ;;
              Linux)
                echo "- AppImage and .deb: not code-signed on this platform" ;;
            esac
            if [ "$SIGN_UPDATER" = true ]; then echo "- updater signatures (.sig): produced"; else echo "- updater signatures (.sig): NOT produced (TAURI_SIGNING_PRIVATE_KEY not set); the in-app updater has nothing to install"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The update manifest the app reads. Runs only when the updater key exists, and only after a
  # reviewer approves the manifest-publish environment (the same one that guards the printer list;
  # its deployment policy must admit `v*` tags, docs/SIGNING.md).
  publish-updater:
    needs: [plan, build]
    if: needs.plan.outputs.updater == 'true'
    runs-on: ubuntu-latest
    environment: manifest-publish
    concurrency: manifest-publish-updater
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET_NAME || 'helixscreen-releases' }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://releases.helixscreen.org' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require upload configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          missing=""
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          case "$R2_ENDPOINT" in https://.r2.*) missing="$missing R2_ACCOUNT_ID" ;; esac
          if [ -n "$missing" ]; then
            echo "::error::Not publishing updates: missing in the manifest-publish environment:$missing. See docs/SIGNING.md."
            exit 1
          fi
      # The bundles' file names carry no reliable version (the macOS one has none at all), so the
      # version comes from the app's config, and a tag run must be tagged with that version.
      - name: Read the app version
        run: |
          version=$(jq -r .version crates/app/tauri.conf.json)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Not publishing updates: tag ${GITHUB_REF_NAME} does not match version ${version} in crates/app/tauri.conf.json."
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bundles
      - name: Write latest.json
        run: python3 scripts/updater_manifest.py bundles "$R2_PUBLIC_URL/installer/app" out "$APP_VERSION"
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -e
          # Bundles first, so latest.json never names a file that is not there yet.
          aws s3 sync out "s3://${R2_BUCKET}/installer/app/${APP_VERSION}" --endpoint-url "$R2_ENDPOINT" --exclude latest.json
          aws s3 cp out/latest.json "s3://${R2_BUCKET}/installer/app/latest.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "max-age=300"
