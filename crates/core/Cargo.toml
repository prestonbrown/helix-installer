[package]
name = "helix_installer_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Installer logic for HelixScreen, independent of any UI toolkit"

[dependencies]
minisign-verify = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util", "rt-multi-thread", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
mdns-sd = "0.21.5"
if-addrs = "0.15.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }

[features]
fakes = []

[dev-dependencies]
axum = "0.8.9"
helix_installer_core = { path = ".", features = ["fakes"] }
minisign = "0.10.0"
tempfile = "3.27.0"
