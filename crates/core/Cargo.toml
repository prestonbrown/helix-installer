[package]
name = "helix_installer_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Installer logic for HelixScreen, independent of any UI toolkit"

[dependencies]
minisign-verify = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[features]
fakes = []

[dev-dependencies]
helix_installer_core = { path = ".", features = ["fakes"] }
minisign = "0.10.0"
tempfile = "3.27.0"
