[package]
name = "helix_installer_app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "HelixScreen Installer desktop shell"

[lib]
name = "helix_installer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
helix_installer_core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
